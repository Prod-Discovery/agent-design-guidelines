<title>Agent Design Guidelines</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: sticky top bar (logo, three page links, CTA button); Patterns page = left section nav + reading column with examples. Visma brand tokens. */
:root{
  --bg:#fefefe; --surface:#fefefe; --raise:#f3f5f6; --soft:#e7ebec; --ink:#131313; --muted:#5c6469; --line:#dce1e3;
  --accent:#7f56fa; --accent-ink:#fefefe; --sel:#e6defe; --sel-ink:#131313; --accent-text:#5b33d6;
  --ok:#2b7a4b; --okbg:#e2f0e6; --warn:#4c0c32; --warnbg:#f3e6ec; --olive:#4a4608; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --font:"Visma Text","Inter","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#131313;--surface:#1c1c1e;--raise:#232326;--soft:#2a2b2e;--ink:#ededed;--muted:#a7b0b4;--line:#36393c;--accent:#8f6bff;--accent-ink:#fefefe;--sel:#3a2f63;--sel-ink:#fefefe;--accent-text:#b9a3ff;--ok:#63c58e;--okbg:#16301f;--warn:#eba9c9;--warnbg:#3a1628;--olive:#d6d08f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#131313;--surface:#1c1c1e;--raise:#232326;--soft:#2a2b2e;--ink:#ededed;--muted:#a7b0b4;--line:#36393c;--accent:#8f6bff;--accent-ink:#fefefe;--sel:#3a2f63;--sel-ink:#fefefe;--accent-text:#b9a3ff;--ok:#63c58e;--okbg:#16301f;--warn:#eba9c9;--warnbg:#3a1628;--olive:#d6d08f;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.55}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:1360px;margin:0 auto;padding-inline:24px;height:72px;display:flex;align-items:center;gap:24px}
.logo{display:flex;align-items:center;gap:12px;text-decoration:none;flex:none}

.logo .prod{font-size:14px;font-weight:600;color:var(--muted);border-left:1px solid var(--line);padding-left:12px}
.nav{display:flex;gap:4px;align-items:stretch;justify-content:flex-end;flex:1;min-width:0;align-self:stretch}
.nav a{position:relative;display:flex;align-items:center;text-decoration:none;font-weight:600;font-size:15px;padding-inline:14px;white-space:nowrap}
.nav a::after{content:"";position:absolute;left:14px;right:14px;bottom:-1px;height:3px;background:transparent}
.nav a:hover::after{background:var(--line)}
.nav a[aria-current="page"]::after{background:var(--ink)}
.cta{flex:none;text-decoration:none;background:transparent;color:var(--ink);border:1.5px solid var(--ink);font-weight:700;font-size:15px;padding:10px 22px;border-radius:99px;white-space:nowrap}
.cta:hover{border:2.5px solid transparent;padding:9px 21px;background:linear-gradient(var(--bg),var(--bg)) padding-box,linear-gradient(90deg,#FFAB65,#7F56FA) border-box;color:var(--ink)}
.cta[aria-current="page"]{background:var(--ink);color:var(--bg)}

/* page shell */
.page{max-width:1360px;margin:0 auto;padding-inline:24px;padding-block:0 64px}
.with-side{display:grid;grid-template-columns:300px minmax(0,1fr);gap:56px;align-items:start}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 72px);height:calc(100vh - 72px);overflow:auto;margin-left:-24px;border-right:1px solid var(--line);display:flex;flex-direction:column}
.grp{display:flex;flex-direction:column;gap:2px;padding:22px 24px 24px;border-bottom:1px solid var(--line)}
.grp:last-child{border-bottom:0}
.grp h2{font-size:12.5px;font-weight:400;letter-spacing:.01em;text-transform:uppercase;color:var(--ink);margin:0 0 8px}
.grp a{position:relative;display:flex;align-items:center;justify-content:flex-start;gap:6px;text-decoration:none;font-size:17px;font-weight:500;padding:3px 0;transition:padding .15s}
.grp a:hover span{text-decoration:underline;text-decoration-color:var(--muted);text-underline-offset:3px}
.grp a[aria-current="page"]{color:var(--ink);font-weight:700;padding-left:16px}
.grp a[aria-current="page"]::before{content:"";position:absolute;left:0;top:50%;width:7px;height:9px;margin-top:-4.5px;background:var(--ink);clip-path:polygon(0 0,100% 50%,0 100%)}
.ext{width:14px;height:14px;flex:none;color:var(--muted)}
.grp .ext{color:var(--ink)}

/* content */
.main{padding-block:40px 0;min-width:0;display:flex;flex-direction:column;gap:28px;max-width:880px}
.crumb{font-size:14px;color:var(--muted);margin:0}
.main h1{font-size:clamp(34px,4.6vw,52px);line-height:1.08;letter-spacing:-.025em;font-weight:800;margin:0;text-wrap:balance}
.lede{display:flex;flex-direction:column;gap:14px;max-width:66ch}
.lede p{margin:0;font-size:18px}
.lede .law{font-weight:600}
.demo{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;font-weight:700;text-decoration:none;border:1.5px solid var(--ink);border-radius:99px;padding:10px 20px}
.demo:hover{background:var(--ink);color:var(--bg)}
.demo:hover .ext{color:var(--bg)}
.demo .ext{color:var(--ink)}
.sec{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:28px}
.sec h2{font-size:24px;font-weight:800;letter-spacing:-.01em;margin:0}
.sec>p{margin:0;color:var(--muted);max-width:66ch}
.examples{display:grid;grid-template-columns:minmax(0,1fr);gap:56px;margin-top:14px}
.ex{margin:0;display:flex;flex-direction:column;gap:12px;min-width:0}
.ex.wide{grid-column:1/-1}
.shot{background:var(--raise);border-radius:12px;padding:20px;display:flex;align-items:center;justify-content:center}
.shot img{display:block;max-width:100%;height:auto;border-radius:8px;box-shadow:0 1px 2px rgba(19,19,19,.06),0 6px 20px rgba(19,19,19,.08)}
.ex figcaption{display:flex;flex-direction:column;gap:4px}
.ex .marker{font-weight:700}
.ex .marker code{font-family:inherit}
.ex .where{font-size:13.5px;color:var(--muted)}
.ex .what{font-size:15px;margin:0}
.soon{border:1.5px dashed var(--line);border-radius:12px;padding:28px;color:var(--muted);max-width:66ch}
.blank{padding-block:56px;display:flex;flex-direction:column;gap:16px;max-width:880px}
.blank h1{font-size:clamp(34px,4.6vw,52px);line-height:1.08;letter-spacing:-.025em;font-weight:800;margin:0}
footer{border-top:1px solid var(--line);margin-top:24px}
footer div{max-width:1360px;margin:0 auto;padding-inline:24px;padding-block:24px;font-size:13px;color:var(--muted)}


/* live examples (scoped copies of the prototype components) */
.shot{position:relative}
.pp{position:absolute;top:12px;right:12px;z-index:2;display:inline-flex;align-items:center;gap:6px;font:inherit;font-size:13px;font-weight:700;color:var(--ink);background:var(--surface);border:1.5px solid var(--ink);border-radius:99px;padding:5px 12px 5px 10px;cursor:pointer}
.pp:hover{background:var(--ink);color:var(--bg)}
.lv.paused .ico.wait,.lv.paused .typing i,.lv.paused .feed li.in{animation-play-state:paused}
.shot:has(.pp){padding-top:56px}

.lv{width:100%;max-width:820px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:10px;font-size:14.5px;line-height:1.45;box-shadow:0 1px 2px rgba(19,19,19,.05),0 6px 20px rgba(19,19,19,.07)}
.lv.narrow{max-width:460px}
.lv .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lv .nm{font-weight:700}
.lv .type{font-weight:700;font-size:11px;letter-spacing:.05em;text-transform:uppercase;border-radius:99px;padding:1px 8px;background:var(--soft);color:var(--olive)}
.lv .rule{margin-left:auto;font-size:12px;color:var(--muted);text-align:right}
.lv .diff{font-family:var(--mono);font-size:12.5px;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.lv .diff div{padding:4px 10px}
.lv .diff .m{background:var(--warnbg);color:var(--warn)}
.lv .diff .p{background:var(--okbg);color:var(--ok)}
.lv .acts{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.lv .by{margin-left:auto;display:inline-flex;align-items:center;flex-wrap:wrap;gap:4px 6px;font-size:12.5px;color:var(--muted)}
.lv .b{font:inherit;font-weight:700;font-size:12.5px;border:1px solid var(--ink);background:var(--surface);color:var(--ink);border-radius:99px;padding:4px 12px;cursor:pointer}
.lv .b:hover{background:var(--raise)}
.lv .b.p:hover{background:var(--ink);opacity:.86}
.lv .b.p{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.lv .res{display:flex;align-items:center;gap:8px}
.lv .ico{display:inline-block;vertical-align:middle;width:18px;height:18px;border-radius:50%;flex:none;position:relative;background:var(--line)}
.lv .ico.ok{background:var(--ok)}
.lv .ico.ok::after{content:"";position:absolute;left:6px;top:3px;width:4px;height:8px;border:solid var(--surface);border-width:0 2px 2px 0;transform:rotate(45deg)}
.lv .ico.wait{background:transparent;border:2.5px solid var(--sel);border-top-color:var(--accent);border-right-color:var(--accent);animation:lvspin .8s linear infinite}
.lv .ico.rej{background:var(--warn)}
.lv .ico.rej::before,.lv .ico.rej::after{content:"";position:absolute;left:8px;top:4px;width:2px;height:10px;background:var(--surface);border-radius:1px;transform:rotate(45deg)}
.lv .ico.rej::after{transform:rotate(-45deg)}
@keyframes lvspin{to{transform:rotate(360deg)}}
.lv .ask{display:flex;gap:8px}
.lv .ask input{flex:1;min-width:0;font:inherit;border:1px solid var(--line);background:var(--raise);color:var(--ink);border-radius:10px;padding:8px 12px}
.lv .chips{display:flex;gap:6px;flex-wrap:wrap}
.lv .chip{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--raise);color:var(--ink);border-radius:99px;padding:3px 10px;cursor:pointer}
.lv .chip[aria-pressed="true"],.lv .chip:hover{border-color:var(--ink)}
.lv .answer{background:var(--raise);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.lv .routed{display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--muted)}
.lv .agent{display:inline-flex;align-items:center;gap:5px;font-family:var(--font);font-weight:700;font-size:12px;line-height:1.3;white-space:nowrap;background:var(--surface);color:var(--accent-text);border:1px solid var(--accent);border-radius:99px;padding:1px 8px 1px 6px;vertical-align:middle}
.lv .agent::before{content:"";width:7px;height:7px;background:var(--accent);transform:rotate(45deg);border-radius:1px;flex:none}
.lv .thinking{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13.5px}
.lv .tag{font-family:var(--mono);font-size:11px;padding:2px 8px;border-radius:99px;background:var(--okbg);color:var(--ok)}
.lv .tag.w{background:var(--warnbg);color:var(--warn)}
.lv .tag.n{background:var(--soft);color:var(--muted)}
.lv .thread{display:flex;flex-direction:column;gap:6px}
.lv .bub{max-width:88%;padding:8px 11px;border-radius:12px;font-size:14px}
.lv .bub small{display:block;font-size:11.5px;color:var(--muted);margin-top:3px}
.lv .bub.me{align-self:flex-start;background:var(--sel);color:var(--sel-ink);border-bottom-left-radius:4px}
.lv .bub.them{align-self:flex-end;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-bottom-right-radius:4px}
.lv .bub.them small{color:inherit;opacity:.7}
.lv .typing{align-self:flex-end;display:inline-flex;gap:4px;padding:10px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.lv .typing i{width:6px;height:6px;border-radius:50%;background:var(--ink);opacity:.4;animation:lvdot 1s infinite}
.lv .typing i:nth-child(2){animation-delay:.15s}.lv .typing i:nth-child(3){animation-delay:.3s}
@keyframes lvdot{50%{opacity:1}}
.lv h3{margin:0;font-size:15px;font-weight:800}
.lv .feed{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.lv .feed li{display:grid;grid-template-columns:18px 1fr;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:13.5px}
.lv .feed li:first-child{border-top:0}
.lv .feed .ico{margin-top:1px}
.lv .feed small{display:block;color:var(--muted);font-size:12px}
.lv .feed li.in{animation:lvin .5s ease-out}
@keyframes lvin{from{background:var(--okbg)}to{background:transparent}}
.lv .hint{font-size:12.5px;color:var(--muted)}
.lv .trg{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.lv .trg li{display:grid;grid-template-columns:110px minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.lv .trg li:first-child{border-top:0}

<script>
async function loadPatterns(){
  try{const r=await fetch('patterns.json',{cache:'no-cache'});if(!r.ok)throw new Error('HTTP '+r.status);return await r.json();}
  catch(e){document.getElementById('page').innerHTML='<main class="blank" id="main"><h1>Could not load the patterns</h1><div class="soon">patterns.json did not load. Open the page through a web server, not as a file (see README).</div></main>';throw e;}
}
(async function(){
const D=await loadPatterns();
const EXT='<svg class="ext" viewBox="0 0 16 16" aria-hidden="true"><path d="M9 2.5h4.5V7M13.5 2.5 7 9M12 9.5v3a1 1 0 0 1-1 1H3.5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const DEMO_URL='demo/payroll.html';
const PLUGIN_URL='https://prod-discovery.github.io/discovery-engine-guide/';
const NAV=[
 ...D.groups.map(g=>[g.name,D.patterns.filter(p=>p.group===g.id).map(p=>[p.id,p.name])]),
 ['Resources',[['claude-plugin','Claude plug-in','ext'],['contact','Contact']]],
];
const DEFAULT='say-its-an-agent';
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function find(id){for(const g of NAV)for(const it of g[1])if(it[0]===id)return {group:g[0],id,label:it[1],ext:it[2]};return null;}

function side(cur){return `<aside class="side" aria-label="Patterns">${NAV.map(g=>`<div class="grp"><h2>${esc(g[0])}</h2>${g[1].map(it=>{
  const href=it[0]==='claude-plugin'?PLUGIN_URL:'#patterns-'+it[0];
  return ` <a href="${href}" ${it[2]&&href.startsWith('http')?'target="_blank" rel="noopener"':''} ${cur===it[0]?'aria-current="page"':''}><span>${esc(it[1])}</span>${it[2]?EXT:''}</a>`;}).join('')}</div>`).join('')}</aside>`;}

/* One template for every pattern page, filled from patterns.json */
const PD=id=>D.patterns.find(x=>x.id===id);
function patternPage(p){const x=PD(p.id);return `
  <h1>${esc(x.name)}</h1>
  <div class="lede">
    ${x.intro.map((t,i)=>`<p${i===0?' class="law"':''}>${esc(t)}</p>`).join('\n    ')}
  </div>
  <a class="demo" href="${DEMO_URL}" target="_blank" rel="noopener">View demo ${EXT}</a>
  <section class="sec" aria-labelledby="exH">
    <h2 id="exH">Examples</h2>
    <p>${esc(x.examples.intro)}</p>
    ${examplesHtml(x.examples.items)}
  </section>`;}
function examplesHtml(list){return `<div class="examples">${list.map(e=>`<figure class="ex ${e.wide?'wide':''}"><div class="shot"><button class="pp" type="button" data-pp="${e.id}"></button><div class="lv ${e.narrow?'narrow':''}" id="lv-${e.id}"></div></div><figcaption><span class="marker"><code>${esc(e.marker)}</code></span><p class="what">${esc(e.what)}</p></figcaption></figure>`).join('')}</div>`;}
const OV=D.groups.map(g=>[g.name,g.summary,D.patterns.filter(p=>p.group===g.id).map(p=>[p.id,p.rule])]);
function overview(){let n=0;const total=OV.reduce((a,g)=>a+g[2].length,0);return `
  <h1>Patterns</h1>
  <div class="lede">
    <p>${total} patterns, grouped by when they apply: before, while and after the agent acts, and over time. Each pattern has a short rule, guidance on what to do and what to avoid, and live examples you can try.</p>
  </div>
  ${OV.map((g,gi)=>`<section class="sec ovsec" aria-labelledby="ov${gi}"><div class="ovh"><div><h2 id="ov${gi}">${esc(g[0])}</h2><p>${esc(g[1])}</p></div></div>
   <div class="ovgrid">${g[2].map(it=>{n++;const f=find(it[0]);return `<a class="ovc" href="#patterns-${it[0]}"><span class="mono">${String(n).padStart(2,'0')}</span><b>${esc(f.label)}</b><span>${esc(it[1])}</span></a>`;}).join('')}</div></section>`).join('')}
  <section class="proto" aria-labelledby="protoH">
    <h2 id="protoH">Prototype your next agent<svg class="spark" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 1.5Q10.5 8.3 14.6 9Q10.5 9.7 10 16.5Q9.5 9.7 5.4 9Q9.5 8.3 10 1.5Z" fill="currentColor"/><path d="M19 12.6Q19.25 16 21.1 16.3Q19.25 16.6 19 20Q18.75 16.6 16.9 16.3Q18.75 16 19 12.6Z" fill="currentColor"/></svg></h2>
    <p class="pl">Apply these patterns to your next agentic experience. The Discovery to Prototype Engine from Product Discovery helps you identify your most value-adding agentic opportunities, and transform them into prototypes ready to be tested with your customers.</p>
    <ol class="psteps">
      <li><b>Identify opportunity</b><span>Bring customer feedback and competitors. The plug-in finds the pain points worth solving.</span></li>
      <li><b>Prototype</b><span>Triggers, actions, boundaries and failure modes, using the patterns on this site.</span></li>
      <li><b>Test with customers</b><span>Get an interactive prototype and a test plan to put in front of real customers.</span></li>
    </ol>
    <div class="pacts"><a class="cta pcta" href="${PLUGIN_URL}" target="_blank" rel="noopener">Get the Claude plug-in ${EXT}</a></div>
  </section>`;}

function placeholder(p){return `<h1>${esc(p.label)}</h1><div class="soon">Content for this pattern is coming soon.</div>`;}


/* ---------- live examples ---------- */
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const LV={propose:null,client:0,feed:null};
const PLAY={propose:false,client:false,feed:false,sched:false,cal:false,start:false,lvl:false,perm:false,levlog:false,offer:false,versus:false,next:false,rec:false,src:false,states:false,vat:false,chg:false,draft:false,queue:false,bulk:false,inbox:false,case:false,fail:false,owner:false,sent:false,warn:false,ulog:false,run:false,event:false,plain:false,week:false,thread:false,back:false,earn:false,stepback:false,ladder:false,bfile:false,empty:false,cover:false,q:false,part:false,guess:false};
const T={propose:[],client:[],feed:[],sched:[],cal:[],start:[],lvl:[],perm:[],levlog:[],offer:[],versus:[],next:[],rec:[],src:[],states:[],vat:[],chg:[],draft:[],queue:[],bulk:[],inbox:[],case:[],fail:[],owner:[],sent:[],warn:[],ulog:[],run:[],event:[],plain:[],week:[],thread:[],back:[],earn:[],stepback:[],ladder:[],bfile:[],empty:[],cover:[],q:[],part:[],guess:[]};
function later(id,f,ms){T[id].push(setTimeout(()=>{if(PLAY[id])f();},ms));}
function stop(id){T[id].forEach(clearTimeout);T[id]=[];}
const PLAYI='<svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M5 3.5v9l7-4.5z" fill="currentColor"/></svg>';
const PAUSEI='<svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><rect x="4" y="3.5" width="2.6" height="9" rx="1" fill="currentColor"/><rect x="9.4" y="3.5" width="2.6" height="9" rx="1" fill="currentColor"/></svg>';
function ctl(id){const b=document.querySelector(`[data-pp="${id}"]`);if(!b)return;const on=PLAY[id];b.innerHTML=(on?PAUSEI:PLAYI)+`<span>${on?'Pause':'Play'}</span>`;b.setAttribute('aria-label',(on?'Pause':'Play')+' example');b.setAttribute('aria-pressed',String(!on));const lv=document.getElementById('lv-'+id);if(lv)lv.classList.toggle('paused',!on);}
function toggle(id){PLAY[id]=!PLAY[id];stop(id);ctl(id);if(PLAY[id])RUN[id]();}
/* proposal */
function rProp(){const el=document.getElementById('lv-propose');if(!el)return;const d=LV.propose;
  el.innerHTML=`<div class="row"><span class="nm">Anna Karlsson</span><span class="type">Sick leave</span><span class="rule">Sick Pay Act: Employer pays days 2–14</span></div>
  ${d?`<p class="res" style="margin:0"><span class="ico ${d==='reject'?'rej':'ok'}"></span><span>${d==='reject'?'Rejected. The payslip keeps sick pay from the employer for all 16 days.':'Accepted. Anna’s October payslip now follows the Sick Pay Act, and days 15–16 are reported to Försäkringskassan.'}</span></p>
   <div class="acts"><button class="b" type="button" data-p="undo">Change decision</button><span class="by">Proposed by <span class="agent">Absence agent</span></span></div>`:
  `<p style="margin:0"><b>Change Anna’s October payslip?</b> She has been sick 16 days in a row from 5 Oct. The employer pays sick pay for days 2–14 only. From day 15, Försäkringskassan pays instead.</p>
   <dl class="cmp"><dt class="now">On the payslip now</dt><dd class="now">Sick pay from the employer for all 16 days</dd><dt class="new">Proposed</dt><dd class="new">Day 1: qualifying deduction<br>Days 2–14: 80% sick pay from the employer<br>Days 15–16: no sick pay from you, reported to Försäkringskassan</dd></dl>
   <div class="acts"><button class="b p" type="button" data-p="accept">Accept</button><button class="b" type="button" data-p="edit">Edit</button><button class="b" type="button" data-p="reject">Reject</button><span class="by">Proposed by <span class="agent">Absence agent</span></span></div>`}`;
  el.onclick=e=>{const b=e.target.closest('[data-p]');if(!b)return;const a=b.dataset.p;LV.propose=a==='undo'?null:a==='edit'?'accept':a;if(PLAY.propose)toggle('propose');else rProp();};}
function runProp(){LV.propose=null;rProp();later('propose',()=>{LV.propose='accept';rProp();later('propose',runProp,3200);},3800);}
/* client question */
function rCli(){const el=document.getElementById('lv-client');if(!el)return;const st=LV.client;
  el.innerHTML=`<div class="row"><span class="nm">Systembolaget, SEK 2 140 on 14 Oct</span><span class="tag ${st>=3?'':st>=2?'w':'n'}">${st>=3?'booked':st>=2?'answered':'waiting'}</span><span class="rule">Sent Thu 30 Oct</span></div>
  <div class="thread"><div class="bub me">What was the purchase at Systembolaget on 14 Oct for?<small>Drafted by <span class="agent">Client agent</span>, sent by you</small></div>
  ${st===1?'<span class="typing" aria-label="Mats is typing"><i></i><i></i><i></i></span>':''}
  ${st>=2?'<div class="bub them">Wine for the catering job at Ekholm Tandvård’s anniversary party.<small>Mats Lindqvist · just now</small></div>':''}</div>
  ${st===2?'<p style="margin:0"><b>Book the purchase like this?</b> Mats says it was wine for a catering job, so it counts as goods for resale.</p><dl class="cmp"><dt class="now">Now</dt><dd class="now">Not booked, waiting for what the purchase was for</dd><dt class="new">Proposed</dt><dd class="new">Account 4010 Goods for resale, 25% VAT</dd></dl><div class="acts"><button class="b p" type="button" data-c="ok">Accept</button><span class="by">Proposed by <span class="agent">Bookkeeping agent</span></span></div>':''}
  ${st>=3?'<p class="res" style="margin:0"><span class="ico ok"></span><span>Booked to 4010 Goods for resale, 25% VAT, based on Mats’s answer.</span></p>':''}
  ${st===0?'<p class="hint" style="margin:0">Waiting for Mats to answer in the client app…</p>':''}`;
  el.onclick=e=>{const b=e.target.closest('[data-c="ok"]');if(!b)return;LV.client=3;rCli();};}
function runCli(){LV.client=0;rCli();later('client',()=>{LV.client=1;rCli();later('client',()=>{LV.client=2;rCli();later('client',()=>{LV.client=3;rCli();later('client',runCli,3000);},3200);},1700);},1500);}
/* agents feed */
const JOBS=[['Close agent','Booking 12 supplier invoices from this morning','Booked 12 supplier invoices from this morning'],['Invoice agent','Matching customer payments','Matched 4 customer payments, SEK 318 000'],['Payroll agent','Checking November time reports','Checked November time reports, all on track'],['VAT agent','Drafting the October VAT return','Drafted October VAT return, SEK 571 850 to pay']];
function rFeed(){const el=document.getElementById('lv-feed');if(!el)return;const f=LV.feed;
  el.innerHTML=`<h3>Work in progress</h3><ul class="feed">${f.map(x=>`<li class="${x.fresh?'in':''}"><span class="ico ${x.run?'wait':'ok'}" role="img" aria-label="${x.run?'Working':'Done'}"></span><span><span class="agent">${esc(x.a)}</span> ${esc(x.run?x.doing:x.done)}<small>${x.run?'Working…':esc(x.when)}</small></span></li>`).join('')}</ul>`;f.forEach(x=>x.fresh=false);}
let jobI=1;
function tickFeed(){const run=LV.feed.find(x=>x.run);if(run){run.run=false;run.when='Just now';run.fresh=true;}
  const j=JOBS[jobI%JOBS.length];jobI++;LV.feed.forEach(x=>{if(!x.run&&x.when==='Just now'&&x!==run)x.when='A minute ago';});
  LV.feed=LV.feed.filter(x=>x.a!==j[0]);LV.feed.unshift({a:j[0],doing:j[1],done:j[2],run:true,when:''});LV.feed=LV.feed.slice(0,4);rFeed();later('feed',tickFeed,3800);}
function runFeed(){later('feed',tickFeed,3800);}

/* ---------- triggers examples ---------- */
const TR={rows:[{id:'r1',when:'Every 5th',what:'Reconcile all bank accounts',last:'5 Oct: 212 of 230 matched, 18 sent to review',next:'Next run 5 Nov, 06:00',on:true,st:'ok'},{id:'r2',when:'On client reply',what:'Match receipts to card purchases',last:'Listening for replies from 42 clients',next:'Runs when a reply arrives',on:true,st:'idle'},{id:'r3',when:'12 Nov',what:'Draft AGI for Skatteverket',last:'Drafted 4 Nov, waiting for your approval',next:'Due 12 Nov',on:true,st:'ready'}],cal:{a:null,b:null,open:null},start:2};
function rSched(){const el=document.getElementById('lv-sched');if(!el)return;
  el.innerHTML=`<div class="row"><h3>Running on its own</h3><span class="tag n" style="margin-left:auto">${TR.rows.filter(r=>r.on).length} of 3 active</span></div>
  <ul class="trg">${TR.rows.map(r=>`<li class="${r.on?'':'off'}"><span class="when">${esc(r.when)}</span><span class="tx"><b>${esc(r.what)}</b><span class="agent" style="align-self:flex-start;margin:3px 0">${({r1:'Reconciliation agent',r2:'Bookkeeping agent',r3:'Payroll agent'})[r.id]}</span><small>${r.on?esc(r.last):'Paused. Nothing runs until you turn it back on.'}</small>${r.on?`<small class="nx">${esc(r.next)}</small>`:''}</span>
   <span class="stt">${!r.on?'<span class="tag n">paused</span>':r.st==='run'?'<span class="ico wait" role="img" aria-label="Running"></span>':r.st==='ready'?'<span class="tag">ready</span>':r.st==='ok'?'<span class="ico ok" role="img" aria-label="Done"></span>':'<span class="tag n">listening</span>'}</span>
   <button class="sw" type="button" role="switch" aria-checked="${r.on}" aria-label="${r.on?'Pause':'Resume'}: ${esc(r.what)}" data-sw="${r.id}"><i></i></button></li>`).join('')}</ul>`;
  el.onclick=e=>{const b=e.target.closest('[data-sw]');if(!b)return;const r=TR.rows.find(x=>x.id===b.dataset.sw);r.on=!r.on;if(r.id==='r2'&&!r.on){r.st='idle';r.last='Listening for replies from 42 clients';}rSched();};}
function runSched(){const r=TR.rows[1];if(!r.on){later('sched',runSched,1500);return;}
  r.st='idle';r.last='Listening for replies from 42 clients';rSched();
  later('sched',()=>{if(!r.on)return runSched();r.st='run';r.last='Lindqvist Café sent a receipt. Matching it…';rSched();
   later('sched',()=>{if(!r.on)return runSched();r.st='ok';r.last='Just now: receipt matched to card purchase, SEK 3 480';rSched();later('sched',runSched,3400);},1800);},1800);}
const CAL={days:['Mon','Tue','Wed','Thu','Fri'],hours:['09','11','14'],ev:{'0-0':['a','Reconciliation','a'],'3-0':['m','Site visit, Ystad'],'0-1':['m','1:1 Lena & Lars'],'2-1':['m','Bank meeting'],'4-1':['a','Reminders','b'],'1-2':['m','Call: Nordström']}};
const CALD={a:{name:'Reconciliation',sched:'Every Monday, 09:00',done:'212 of 230 lines matched, 18 sent to review'},b:{name:'Reminders',sched:'Every Friday, 11:00',done:'Reminded 3 clients about missing receipts'}};
function rCal(){const el=document.getElementById('lv-cal');if(!el)return;const c=TR.cal;
  const cell=(d,h)=>{const e=CAL.ev[d+'-'+h];if(!e)return '';if(e[0]==='m')return `<span class="mt">${esc(e[1])}</span>`;const k=e[2],st=c[k];
    return `<button class="ag ${st==='run'?'run':''} ${c.open===k?'sel':''}" type="button" data-ag="${k}">${st==='run'?'<span class="ico wait" aria-hidden="true"></span>':st==='done'?'<span class="ico ok" aria-hidden="true"></span>':'<span class="dia" aria-hidden="true">◆</span>'}<span>${esc(e[1])}</span></button>`;};
  el.innerHTML=`<div class="row"><span class="nm">Week 41</span><span class="hint">Berg Bygg AB · Calendar</span><button class="b" type="button" style="margin-left:auto" data-cal="new">+ Schedule an agent</button></div>

  <ul class="sbl">${SBR.slice(0,EV.k).map((r,i)=>`<li><span class="mono">${r[0]}</span><span>${r[1]}${EV.sb[i]?`<small style="color:var(--warn)">Corrected by you: ${r[2]} → ${SBFIX[i]}</small>`:`<small class="rc">Coded by <span class="agent">Account agent</span>: ${r[2]}</small>`}</span>${!EV.sb[i]&&!back?`<button class="b" type="button" data-sb="${i}">Correct</button>`:'<span></span>'}</li>`).join('')}</ul>
  ${back?`<div class="offerbox"><span><b>I’ve stepped back to Copilot.</b> You corrected 2 of the last 5 codings. I’ll suggest and you choose, until 10 more are approved unchanged.</span><span class="acts"><button class="b p" type="button" data-sb="ok">Okay</button><button class="b" type="button" data-sb="keep">Keep Autopilot</button><span class="by"><span class="agent">Account agent</span></span></span></div>`:`<p class="hint" style="margin:0">${c} correction${c===1?'':'s'} · steps back after 2</p>`}`;

function runLadder(){const seq=[0,1,2,1];let i=0;const step=()=>{EV.lv=seq[i%4];rLadder();i++;later('ladder',step,1700);};step();}

function runEmpty(){FD.e='ask';rEmpty();later('empty',()=>{FD.e='think';rEmpty();later('empty',()=>{FD.e='done';rEmpty();later('empty',()=>{FD.e='asked';rEmpty();later('empty',runEmpty,2600);},2600);},1400);},900);}
function rCover(){const el=document.getElementById('lv-cover');if(!el)return;const v=FD.c;

const UQ=[['sick','Sick leave','Best guess','Qualifying deduction for Monday. Sick pay from day 2 if she is off longer.'],['vac','Vacation','','1 vacation day taken, 24 left. Full pay.'],['unpaid','Unpaid leave','','1 day’s salary deducted, SEK 1 840. No sick pay.']];
const UN={sel:'sick',ans:null,n:63,pa:null,g:0};
function rQ(){const el=document.getElementById('lv-q');if(!el)return;const a=UN.ans;
  el.innerHTML=`<div class="row"><span class="nm">Anna Karlsson</span><span class="type">Absence</span><span class="rule">Monday 6 Oct · 8 h</span></div>
  ${a?`<p class="res" style="margin:0"><span class="ico ok"></span><span>Booked as ${UQ.find(o=>o[0]===a)[1].toLowerCase()}. ${esc(UQ.find(o=>o[0]===a)[3])} Answered by you.</span></p><div class="acts"><button class="b" type="button" data-uq="reset">Change answer</button><span class="by">Asked by <span class="agent">Absence agent</span></span></div>`:
  `<div class="offerbox"><span><b>Anna was off on Monday, but there’s no absence reason.</b> Sick leave, vacation or unpaid leave? It affects her sick pay.</span>
   <div class="opts" role="radiogroup" aria-label="Absence reason">${UQ.map(o=>`<button type="button" role="radio" class="opt" data-uo="${o[0]}" aria-checked="${UN.sel===o[0]}"><span><b>${o[1]}</b>${o[2]?` <span class="tag n">${o[2]}</span>`:''}</span><small>${esc(o[3])}</small></button>`).join('')}</div>
   <span class="hint" style="color:inherit;opacity:.8">Why the guess: no vacation or leave was requested for Monday.</span>
   <span class="acts"><button class="b p" type="button" data-uq="ok">Book as ${UQ.find(o=>o[0]===UN.sel)[1].toLowerCase()}</button><button class="b" type="button" data-uq="ask">Ask Anna</button><span class="by">Asked by <span class="agent">Absence agent</span></span></span></div>`}
  ${UN.asked?'<p class="hint" style="margin:0">Sent Anna a question in the app. The payslip waits for her answer, the rest of payroll does not.</p>':''}`;
  el.onclick=e=>{const o=e.target.closest('[data-uo]');if(o){if(PLAY.q)toggle('q');UN.sel=o.dataset.uo;rQ();return;}const b=e.target.closest('button[data-uq]');if(!b)return;if(PLAY.q)toggle('q');const a=b.dataset.uq;
    if(a==='ok'){UN.ans=UN.sel;UN.asked=false;}else if(a==='ask'){UN.asked=true;}else{UN.ans=null;UN.asked=false;}rQ();};}
function runQ(){UN.ans=null;UN.asked=false;UN.sel='sick';rQ();const seq=['vac','unpaid','sick'];let i=0;const step=()=>{if(i<3){UN.sel=seq[i];i++;rQ();later('q',step,1300);}else{UN.ans='sick';rQ();later('q',runQ,3000);}};later('q',step,1400);}
function rPart(){const el=document.getElementById('lv-part');if(!el)return;const done=UN.pa!==null;
  el.innerHTML=`<div class="row"><h3>October payroll</h3><span class="agent">Payroll agent</span><span class="tag ${done?'':'n'}" style="margin-left:auto">${done?'64 of 64 ready':UN.n+' of 64 ready'}</span></div>
  <div class="pbar"><i style="width:${(done?64:UN.n)/64*100}%"></i></div>
  <ul class="cards">${[['Erik Nilsson','Final salary with vacation pay','41 220 kr'],['Maria Ek','Overtime 6 h added','38 960 kr']].map(r=>`<li><span class="mono">Ready</span><span>${r[0]}<small class="rc">✓ ${r[1]}</small></span><span class="amt">${r[2]}</span></li>`).join('')}
  <li class="${done?'':'q'}"><span class="mono">${done?'Ready':'Ask'}</span><span>Anna Karlsson${done?`<small class="rc">✓ Monday booked as ${UN.pa}</small>`:'<small>11 of 12 lines ready. Monday 6 Oct has no absence reason.</small>'}</span><span class="amt">${done?(UN.pa==='unpaid leave'?'32 560 kr':UN.pa==='sick leave'?'33 812 kr':'34 400 kr'):'–'}</span>
   ${done?'':`<span class="acts" style="grid-column:2/-1">${[['sick leave','Sick leave (best guess)'],['vacation','Vacation'],['unpaid leave','Unpaid leave']].map((o,j)=>`<button class="b ${j===0?'p':''}" type="button" data-pa="${o[0]}">${o[1]}</button>`).join('')}</span>`}</li></ul>
  ${done?'<div class="acts"><button class="b" type="button" data-pa="reset">Start over</button><span class="by"><span class="agent">Payroll agent</span></span></div>':'<p class="hint" style="margin:0">The other 63 payslips carry on while this waits.</p>'}`;
  el.onclick=e=>{const b=e.target.closest('button[data-pa]');if(!b)return;if(PLAY.part)toggle('part');const a=b.dataset.pa;UN.pa=a==='reset'?null:a;if(a==='reset')UN.n=63;rPart();};}
function runPart(){UN.pa=null;UN.n=58;rPart();const step=()=>{UN.n++;rPart();if(UN.n<63)later('part',step,500);else later('part',()=>{UN.pa='sick leave';rPart();later('part',runPart,3000);},2000);};later('part',step,600);}
function rGuess(){const el=document.getElementById('lv-guess');if(!el)return;const v=UN.g;
  el.innerHTML=`<div class="seg vs" role="group" aria-label="Compare">${['Agent asks','Agent guesses'].map((n,j)=>`<button type="button" data-ug="${j}" aria-pressed="${v===j}">${n}</button>`).join('')}</div>

   <div class="acts"><button class="b p" type="button">Sick leave</button><button class="b" type="button">Vacation</button><button class="b" type="button">Unpaid leave</button><span class="by">Asked by <span class="agent">Absence agent</span></span></div>`:
   `<p class="res" style="margin:0"><span class="ico ok"></span><span>Booked Monday as unpaid leave. SEK 1 840 deducted.</span></p>
   <div class="acts"><span class="by">Done by <span class="agent">Absence agent</span></span></div>
   <p class="warnline">Anna was sick. She loses a day’s pay instead of the qualifying deduction, and finds out on payday.</p>`}`;
  el.onclick=e=>{const b=e.target.closest('[data-ug]');if(!b)return;if(PLAY.guess)toggle('guess');UN.g=+b.dataset.ug;rGuess();};}
function runGuess(){later('guess',()=>{UN.g=1-UN.g;rGuess();runGuess();},2800);}
function initUnc(){if(!document.getElementById('lv-q'))return;UN.sel='sick';UN.ans=null;UN.asked=false;UN.n=63;UN.pa=null;UN.g=0;rQ();rPart();rGuess();}

const RUN={propose:runProp,client:runCli,feed:runFeed,sched:runSched,cal:runCal,start:runStart,lvl:runLvl,perm:runPerm,levlog:runLog,offer:runOffer,versus:runVs,next:runNext,rec:runRec,src:runSrc,states:runStates,vat:runVat,chg:runChg,draft:runDraft,queue:runQueue,bulk:runBulk,inbox:runInbox,case:runCase,fail:runFail,owner:runOwner,sent:runSent,warn:runWarn,ulog:runUlog,run:runRun,event:runEvent,plain:runPlain,week:runWeek,thread:runThread,back:runBack,earn:runEarn,stepback:runStep,ladder:runLadder,bfile:runBfile,empty:runEmpty,cover:runCover,q:runQ,part:runPart,guess:runGuess};
function initLive(){Object.keys(T).forEach(stop);Object.keys(PLAY).forEach(k=>PLAY[k]=false);initTrig();initAuto();initSug();initLP();initAct();initExc();initHO();initUndo();initLog();initRec();initEvo();initFD();initUnc();bindPP();if(!document.getElementById('lv-propose'))return;

function bindCopy(){document.querySelectorAll('[data-copy]').forEach(b=>{b.onclick=async()=>{const t=document.getElementById('protoPrompt').textContent;try{await navigator.clipboard.writeText(t);b.textContent='Copied';}catch(e){b.textContent='Select and copy';}setTimeout(()=>{b.textContent='Copy';},1800);};});}
function bindPP(){bindCopy();document.querySelectorAll('[data-pp]').forEach(b=>{b.onclick=()=>toggle(b.dataset.pp);ctl(b.dataset.pp);});}

const PRIN=D.principles.map(x=>[x.id,x.name,x.statement,x.in_practice.map(c=>c.pita?[c.product,c.text,c.source,1]:[c.product,c.text,c.source]),x.patterns]);
function sideP(cur){return `<aside class="side pr" aria-label="Principles"><div class="grp">${PRIN.map(x=>`<a href="#principles-${x[0]}" ${cur===x[0]?'aria-current="page"':''}><span>${esc(x[1])}</span></a>`).join('')}</div></aside>`;}
function prinOverview(){return `
  <h1>Principles</h1>
  <div class="lede"><p>${PRIN.length} principles behind every pattern. They describe how agents should behave in Visma products, so that people stay in control while the agents do the work.</p></div>
  <section class="sec ovsec" aria-label="All principles"><div class="ovgrid">${PRIN.map((x,i)=>`<a class="ovc" href="#principles-${x[0]}"><span class="mono">${String(i+1).padStart(2,'0')}</span><b>${esc(x[1])}</b><span>${esc(x[2])}</span></a>`).join('')}</div></section>`;}
function prinPage(x){return `
  <h1>${esc(x[1])}</h1>
  <div class="lede"><p class="law">${esc(x[2])}</p></div>
  <section class="sec" aria-labelledby="ipH"><h2 id="ipH">In practice</h2><p>Products that already work this way, inside and outside accounting.</p>
   <div class="ipgrid">${x[3].map(c=>`<div class="ipc">${c[3]?'<span class="pita">PITA</span>':''}<b>${esc(c[0])}</b><span class="ipt">${esc(c[1])}</span></div>`).join('')}</div></section>
  <section class="sec" aria-labelledby="rpH"><h2 id="rpH">Patterns to use</h2><p>Patterns that put this principle into practice.</p>
   <div class="ovgrid" style="margin-top:14px">${x[4].map(id=>{const f=find(id);const o=OV.flatMap(g=>g[2]).find(it=>it[0]===id);return `<a class="ovc" href="#patterns-${id}"><b>${esc(f.label)}</b><span>${esc(o?o[1]:'')}</span></a>`;}).join('')}</div></section>`;}

const GUIDE=Object.fromEntries(D.patterns.map(p=>[p.id,{l:p.look_for,d:p.do,a:p.avoid}]));
function guideHtml(id){const x=GUIDE[id];if(!x)return '';return `<div class="guide"><div class="look"><h2 class="glbl">What to look for</h2><ul>${x.l.map(i=>`<li>${esc(i)}</li>`).join('')}</ul></div>
  <div class="da"><div class="dobox"><span class="glbl">Do</span><p>${esc(x.d)}</p></div><div class="avbox"><span class="glbl">Avoid</span><p>${esc(x.a)}</p></div></div></div>

const DEMOS=[
 ['demo/front-door.html','Front door','Lena, the accountant, starts her Monday here. The agents bring her the work that needs her, with links to payroll and the October close.'],
 ['demo/payroll.html','Payroll','Maria runs the October payroll. The agent collects, checks and prepares the payments, and Maria approves them.'],
 ['demo/accounting.html','Accounting','Lena closes October. The agent books and reconciles, and hands her only the cases that need her judgement.']
];
function demoPage(){return `
  <h1>Demo</h1>
  <div class="lede">
    <p>Three interactive prototypes show the patterns working together in one fictional company, Berg Bygg AB, a construction company with 64 employees. In each demo, turn on Show design patterns to see which pattern is behind each part of the screen.</p>
  </div>
  <div class="ovgrid">${DEMOS.map((d,i)=>`<a class="ovc" href="${d[0]}" target="_blank" rel="noopener"><span class="mono">${String(i+1).padStart(2,'0')}</span><b>${esc(d[1])} ${EXT}</b><span>${esc(d[2])}</span></a>`).join('')}</div>`;}

function route(){
  let h=(location.hash||'').slice(1);
  if(!h)h='patterns';
  const top=h.startsWith('patterns-')?'patterns':h.startsWith('principles-')?'principles':h;
  document.querySelectorAll('[data-top]').forEach(a=>{if(a.dataset.top===top)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});
  const pg=$('#page');
  if(top==='patterns'){
    if(h==='patterns'){pg.innerHTML=`<div class="with-side">${side('overview')}<main class="main" id="main">${overview()}</main></div>`;return;}
    const p=find(h.slice(9))||find(DEFAULT);
    let body=`${PD(p.id)?patternPage(p):placeholder(p)}`;
    body=body.replace('<a class="demo"',guideHtml(p.id)+'<a class="demo"');
    pg.innerHTML=`<div class="with-side">${side(p.id)}<main class="main" id="main">${body}</main></div>`;
  } else if(top==='principles'){
    const x=PRIN.find(p=>'principles-'+p[0]===h);
    pg.innerHTML=`<div class="with-side">${sideP(x?x[0]:'')}<main class="main" id="main">${x?prinPage(x):prinOverview()}</main></div>`;
  } else if(top==='demo'){
    pg.innerHTML=`<main class="blank" id="main">${demoPage()}</main>`;
  } else {
    const names={principles:'Principles',demo:'Demo',assess:'Assess your agent'};
    const n=names[top]||'Principles';
    pg.innerHTML=`<main class="blank" id="main"><h1>${esc(n)}</h1><div class="soon">This page is coming soon.</div></main>`;
  }
}
window.addEventListener('hashchange',()=>{route();initLive();window.scrollTo({top:0});});
route();initLive();
})();
