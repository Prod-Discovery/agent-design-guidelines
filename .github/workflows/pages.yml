# Publishes the demos to GitHub Pages on every push to main. The guidelines
# themselves live on Cloud Run (deploy.yml); here, index.html and 404.html are
# a redirect so old guidelines links keep working.
# patterns.json is still checked first: if it has a problem, the run fails and
# nothing is published.
name: Publish demos

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check patterns.json
        run: python3 scripts/build_patterns.py --check

      # Only the demos live on GitHub Pages. The guidelines are on Cloud Run;
      # the redirect page sends every old guidelines link there.
      - name: Collect the demos and the redirect
        run: |
          mkdir -p _site
          cp -R demo .nojekyll _site/
          cp pages/redirect.html _site/index.html
          cp pages/redirect.html _site/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
