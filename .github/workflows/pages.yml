# Publishes the site to GitHub Pages on every push to main.
# patterns.json is validated and patterns.md is generated from it first.
# If patterns.json has a problem, the run fails and the live site keeps
# its last good version.
name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check that only patterns.json changed
        env:
          EXPECTED_LOCK_SHA: ${{ vars.PROTECTED_LOCK_SHA }}
        run: python3 scripts/check_protected.py

      - name: Validate patterns.json and generate patterns.md
        run: python3 scripts/build_patterns.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
