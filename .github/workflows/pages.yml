# GitHub Pages only forwards old links. Everything, demos included, lives on
# Cloud Run behind Visma sign-in (deploy.yml). Here, index.html, 404.html and
# every demo/<name>.html are pages/redirect.html, so old links keep working.
# patterns.json is still checked first: if it has a problem, the run fails and
# nothing is published.
name: Forward old links

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check that only patterns.json changed
        env:
          EXPECTED_LOCK_SHA: ${{ vars.PROTECTED_LOCK_SHA }}
        run: python3 scripts/check_protected.py

      - name: Check the site's pages and demos
        run: python3 scripts/check_site.py

      - name: Check patterns.json
        run: python3 scripts/build_patterns.py --check

      # No content on GitHub Pages: every old address (guidelines and demos)
      # gets the redirect page, which forwards to the same place on Cloud Run.
      - name: Build the redirects
        run: |
          mkdir -p _site/demo
          cp .nojekyll _site/
          cp pages/redirect.html _site/index.html
          cp pages/redirect.html _site/404.html
          for f in demo/*.html; do cp pages/redirect.html "_site/$f"; done

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
